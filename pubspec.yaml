name: nguyenanh
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.5+13

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.70.2

  # Networking
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.1.4
  cookie_jar: ^4.0.8
  jwt_decoder: ^2.0.1
  socket_io_client: ^3.0.2

  # State Management
  provider: ^6.1.5+1

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utils
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.2
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
