<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 260" width="120" height="260" role="img" aria-label="Editable top view truck icon">
  <!-- side shadows -->
  <rect fill="rgba(0,0,0,.18)" x="14" y="92" width="7" height="46" rx="3"/>
  <rect fill="rgba(0,0,0,.18)" x="99" y="92" width="7" height="46" rx="3"/>
  <rect fill="rgba(0,0,0,.18)" x="14" y="176" width="7" height="50" rx="3"/>
  <rect fill="rgba(0,0,0,.18)" x="99" y="176" width="7" height="50" rx="3"/>

  <!-- rear cargo box -->
  <rect fill="#007bff" stroke="#004085" stroke-width="2" x="20" y="82" width="80" height="170" rx="7"/>
  <path fill="none" stroke="#0056b3" stroke-width="3" stroke-linecap="round" d="M31 94v145M42 94v145M53 94v145M64 94v145M75 94v145M86 94v145"/>

  <!-- cabin -->
  <path fill="#007bff" stroke="#004085" stroke-width="2" d="M33 17 C36 7 45 3 60 3 C75 3 84 7 87 17 L94 74 C95 81 90 86 83 86 H37 C30 86 25 81 26 74 Z"/>

  <!-- cabin roof grooves -->
  <path fill="none" stroke="#0056b3" stroke-width="3" stroke-linecap="round" d="M48 16h24M45 24h30M43 32h34"/>

  <!-- windshield -->
  <path fill="#202124" d="M31 45 C39 41 81 41 89 45 L86 58 C77 55 43 55 34 58 Z"/>

  <!-- hood -->
  <path fill="#007bff" stroke="#004085" stroke-width="2" d="M34 61 H86 L82 82 H38 Z"/>
  <path fill="none" stroke="#0056b3" stroke-width="3" stroke-linecap="round" d="M44 67v11M50 67v11M56 67v11M62 67v11M68 67v11M74 67v11"/>

  <!-- headlights / small colored markers -->
  <path d="M36 14 L42 11" stroke="#f4b400" stroke-width="2" stroke-linecap="round"/>
  <path d="M84 14 L78 11" stroke="#f4b400" stroke-width="2" stroke-linecap="round"/>

  <!-- mirrors -->
  <path stroke="#333" stroke-width="2" stroke-linecap="round" d="M28 45 L15 42"/>
  <path stroke="#333" stroke-width="2" stroke-linecap="round" d="M92 45 L105 42"/>

  <!-- wheels visible from top side -->
  <rect fill="#333333" x="8" y="111" width="8" height="25" rx="3"/>
  <rect fill="#333333" x="104" y="111" width="8" height="25" rx="3"/>
  <rect fill="#333333" x="8" y="188" width="8" height="32" rx="3"/>
  <rect fill="#333333" x="104" y="188" width="8" height="32" rx="3"/>
</svg>
